<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101214" />
    <title>Plain Webview Window</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: radial-gradient(circle at top, #18202a 0%, #0b0d10 62%, #050607 100%);
        color: #e6eef7;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      body {
        display: grid;
        place-items: center;
      }

      .frame {
        display: grid;
        gap: 0.5rem;
        padding: 1.5rem 1.75rem;
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(8px);
      }

      .title {
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .copy {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        color: #9fb0c3;
      }

      .status {
        margin-top: 0.35rem;
        font-size: 0.68rem;
        letter-spacing: 0.08em;
        color: #7dd3fc;
      }
    </style>
    <script>
      console.log('[window-action] plain webview html shell boot', {
        href: window.location.href,
        readyState: document.readyState,
      });

      const logLifecycle = (eventName, extra = {}) => {
        console.log(`[window-action] plain webview ${eventName}`, {
          href: window.location.href,
          readyState: document.readyState,
          visibilityState: document.visibilityState,
          ...extra,
        });
      };

      window.addEventListener('error', (event) => {
        logLifecycle('error event', {
          message: event.message,
          filename: event.filename,
          lineno: event.lineno,
          colno: event.colno,
        });
      });

      window.addEventListener('unhandledrejection', (event) => {
        logLifecycle('unhandledrejection', {
          reason: String(event.reason),
        });
      });

      document.addEventListener('readystatechange', () => {
        logLifecycle('readystatechange');
      });

      document.addEventListener('visibilitychange', () => {
        logLifecycle('visibilitychange');
      });

      window.addEventListener('focus', () => {
        logLifecycle('focus');
      });

      window.addEventListener('blur', () => {
        logLifecycle('blur');
      });

      window.addEventListener('pageshow', (event) => {
        logLifecycle('pageshow', { persisted: event.persisted });
      });

      window.addEventListener('pagehide', (event) => {
        logLifecycle('pagehide', { persisted: event.persisted });
      });

      window.addEventListener('beforeunload', () => {
        logLifecycle('beforeunload');
      });

      window.addEventListener('unload', () => {
        logLifecycle('unload');
      });
    </script>
  </head>
  <body>
    <div class="frame">
      <div class="title">Plain Webview Window</div>
      <div class="copy">This page has no shared app shell. It exists to trace webview startup.</div>
      <div class="status">Waiting for early lifecycle logs...</div>
    </div>
    <script>
      console.log('[window-action] plain webview body boot', {
        href: window.location.href,
        readyState: document.readyState,
      });
      window.addEventListener('DOMContentLoaded', () => {
        console.log('[window-action] plain webview DOMContentLoaded', {
          href: window.location.href,
          readyState: document.readyState,
        });
      });
      window.addEventListener('load', () => {
        console.log('[window-action] plain webview load', {
          href: window.location.href,
          readyState: document.readyState,
        });
      });
      requestAnimationFrame(() => {
        console.log('[window-action] plain webview first animation frame', {
          href: window.location.href,
          readyState: document.readyState,
        });
      });
      setTimeout(() => {
        console.log('[window-action] plain webview delayed heartbeat 2', {
          href: window.location.href,
          readyState: document.readyState,
        });
      }, 500);
      setTimeout(() => {
        console.log('[window-action] plain webview delayed heartbeat', {
          href: window.location.href,
          readyState: document.readyState,
        });
      }, 100);
    </script>
  </body>
</html>
