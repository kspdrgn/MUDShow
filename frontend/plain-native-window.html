<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>Plain Native Window</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #111111;
        color: #eaeaea;
        font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }

      body {
        display: grid;
        place-items: center;
      }

      .frame {
        padding: 1.5rem 2rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.03);
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
      }

      .title {
        font-size: 0.85rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .copy {
        margin-top: 0.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        color: #a7a7a7;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="title">Plain Native Window</div>
      <div class="copy">No shared shell, no pop-out logic, no frontend mount.</div>
    </div>
  </body>
</html>
